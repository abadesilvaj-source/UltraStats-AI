[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "ultrastats-ai"
version = "0.1.0"
description = "UltraStats AI - Plataforma de análise estatística e inteligência para futebol"
readme = "README.md"
requires-python = ">=3.12"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = [
    "src",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

python_files = [
    "test_*.py",
]

python_functions = [
    "test_*",
]

addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=ultrastats_ai",
    "--cov-branch",
    "--cov-report=term-missing",
]


[tool.coverage.run]
branch = true

source = [
    "src/ultrastats_ai",
]

omit = [
    "*/__init__.py",
]


[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]


[tool.coverage.html]
directory = "htmlcov"
