services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrations:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scheduler:
    build: .
    command: ["python", "-m", "scripts.run_scheduler"]
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - staging_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_scheduler_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "backend.main:app",
        "--host=0.0.0.0",
        "--port=8000",
      ]
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8516}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "dashboard/Home.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    env_file: ${STAGING_ENV_FILE:-.env.staging}
    ports:
      - "${LEGACY_DASHBOARD_PORT:-8517}:8501"
    volumes:
      - staging_logs:/app/logs
      - staging_exports:/app/exports
    depends_on:
      migrations:
        condition: service_completed_successfully
      scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  staging_postgres:
  staging_logs:
  staging_exports:
