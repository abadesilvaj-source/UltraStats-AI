services:
  postgres:
    image: postgres:17
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    volumes:
      - production_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]
    restart: unless-stopped

  migrations:
    image: ${ULTRASTATS_IMAGE:?ULTRASTATS_IMAGE is required}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  scheduler:
    image: ${ULTRASTATS_IMAGE:?ULTRASTATS_IMAGE is required}
    command: ["python", "-m", "scripts.run_scheduler"]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - production_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_scheduler_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  dashboard:
    image: ${ULTRASTATS_IMAGE:?ULTRASTATS_IMAGE is required}
    command:
      [
        "python", "-m", "streamlit", "run", "dashboard/Home.py",
        "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"
      ]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      migrations:
        condition: service_completed_successfully
      scheduler:
        condition: service_healthy
    volumes:
      - production_logs:/app/logs
      - production_exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:

volumes:
  production_postgres:
  production_logs:
  production_exports:
  production_caddy_data:
  production_caddy_config:
