services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ultrastats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultrastats123}
      POSTGRES_DB: ${POSTGRES_DB:-ultrastats_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ultrastats_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrations:
    build: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: ${APP_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  scheduler:
    build: ./backend
    command: ["python", "-m", "scripts.run_scheduler"]
    env_file: ${APP_ENV_FILE:-.env}
    volumes:
      - ultrastats_logs:/app/logs
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.check_scheduler_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ${APP_ENV_FILE:-.env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8516}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend-mobile:
    build:
      context: .
      dockerfile: frontend-mobile/Dockerfile
    ports:
      - "${MOBILE_FRONTEND_PORT:-8517}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ultrastats_postgres:
  ultrastats_logs:
